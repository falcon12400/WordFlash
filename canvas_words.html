<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>中文練習 - 大字顯示</title>
  <style>
    :root {
      color-scheme: light;
    }
    [hidden] {
      display: none !important;
    }
    html, body {
      margin: 0;
      height: 100%;
    }
    body {
      margin: 0;
      background: radial-gradient(circle at top, #f7f4e8 0%, #efe6d5 45%, #e8dcc8 100%);
      font-family: "Noto Serif TC", "PingFang TC", "Heiti TC", serif;
      color: #2b2b2b;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-height: 100dvh;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      border-bottom: 2px solid #2b2b2b;
      background: rgba(255, 249, 236, 0.92);
      backdrop-filter: blur(6px);
    }
    header .title {
      font-size: 20px;
      letter-spacing: 0.08em;
      font-weight: 700;
    }
    header .menu {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      flex-wrap: wrap;
    }
    header select,
    header a,
    header button {
      border: 2px solid #2b2b2b;
      border-radius: 6px;
      padding: 6px 10px;
      background: #fff9ec;
      font-family: inherit;
      font-size: 14px;
      color: inherit;
      text-decoration: none;
      cursor: pointer;
    }
    main {
      display: grid;
      place-items: center;
      min-height: 0;
      padding: 28px 24px 32px;
      box-sizing: border-box;
    }
    .flashcard-layout {
      width: min(92vw, 1000px);
      display: grid;
      grid-template-rows: auto auto auto;
      justify-items: center;
      gap: 16px;
    }
    .stage {
      width: 100%;
      height: min(70vh, 700px);
      border: 6px solid #2b2b2b;
      background: #fff9ec;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
      display: grid;
      place-items: center;
      overflow: hidden;
      box-sizing: border-box;
    }
    .word-display {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      max-width: 82%;
      color: #2b2b2b;
      font-family: var(--word-font);
      font-size: var(--word-size);
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
    }
    .zhuyin-cell {
      position: relative;
      display: inline-block;
      width: 1em;
      padding-inline-end: 1.2em;
    }
    .semantic-ruby {
      display: none;
    }
    .character-visual {
      display: block;
      width: 1em;
      line-height: 1;
    }
    .zhuyin-visual {
      position: absolute;
      left: 47%;
      top: 50%;
      transform: translateY(-50%);
      color: #2b2b2b;
      font-family: "Microsoft JhengHei", "Noto Sans TC", "PingFang TC", sans-serif;
      font-size: 0.22em;
      font-weight: 600;
      line-height: 1.05;
      writing-mode: vertical-rl;
      text-orientation: upright;
    }
    .hint {
      margin: 0;
      font-size: 16px;
      letter-spacing: 0.08em;
      text-align: center;
    }
    .controls {
      display: flex;
      justify-content: center;
      gap: 12px;
    }
    .controls button {
      border: 2px solid #2b2b2b;
      border-radius: 8px;
      padding: 10px 24px;
      background: #fff9ec;
      font-family: inherit;
      font-size: 16px;
      color: inherit;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.08);
    }
    .practice-panel {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      padding: 14px 18px;
      border: 2px solid #2b2b2b;
      border-radius: 10px;
      background: rgba(255, 249, 236, 0.94);
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.08);
    }
    .practice-summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }
    .practice-stat {
      display: grid;
      gap: 2px;
      text-align: center;
    }
    .practice-stat span { font-size: 13px; }
    .practice-stat strong { font-size: 24px; }
    .answer-controls {
      display: flex;
      gap: 10px;
    }
    .answer-controls button {
      min-height: 50px;
      padding: 8px 18px;
      border: 2px solid #2b2b2b;
      border-radius: 8px;
      background: #fff9ec;
      color: inherit;
      font-family: inherit;
      font-size: 18px;
      cursor: pointer;
    }
    .answer-controls .correct-button { background: #e1ead8; }
    .answer-controls .incorrect-button { background: #f1dfd7; }
    /* Phone portrait: compact controls above a card that fills the remaining view. */
    @media (max-width: 720px) and (orientation: portrait) {
      header {
        display: grid;
        gap: 12px;
        align-items: flex-start;
        padding: 12px 16px 14px;
      }
      header .title {
        font-size: 21px;
      }
      header .menu {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        width: 100%;
        gap: 9px;
      }
      header .menu label {
        display: grid;
        gap: 4px;
        grid-column: 1 / -1;
      }
      header select,
      header a,
      header button {
        box-sizing: border-box;
        min-width: 0;
        min-height: 48px;
        padding: 8px;
        font-size: 16px;
      }
      header a,
      header button {
        display: grid;
        place-items: center;
      }
      header select {
        width: 100%;
      }
      main {
        display: block;
        padding: 14px 12px 16px;
      }
      .flashcard-layout {
        width: 100%;
        height: 100%;
        min-height: 0;
        grid-template-rows: minmax(220px, 1fr) auto auto auto;
        gap: 12px;
      }
      .controls button {
        width: 100%;
        min-height: 56px;
        padding: 12px 24px;
        font-size: 20px;
      }
      .practice-panel {
        grid-template-columns: 1fr;
        gap: 12px;
        padding: 12px;
      }
      .answer-controls { display: grid; grid-template-columns: 1fr 1fr; }
      .answer-controls button { min-height: 52px; font-size: 19px; }
      .hint {
        max-width: 32rem;
        padding: 0 6px;
        font-size: 14px;
        line-height: 1.45;
      }
      .stage {
        min-height: 0;
        height: 100%;
        border-width: 5px;
      }
    }
    /* Tablet and desktop: the toolbar stays horizontal and the card uses a wide reading area. */
    @media (min-width: 721px) {
      .flashcard-layout {
        grid-template-rows: auto auto auto;
      }
      .stage {
        width: min(88vw, 1080px);
        height: min(68vh, 720px);
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="title">WordFlash</div>
    <div class="menu">
      <label id="unitControl">
        字庫
        <select id="unitSelect"></select>
      </label>
      <label id="fontControl">
        字型
        <select id="fontSelect"></select>
      </label>
      <button id="speakButton" type="button">播放讀音</button>
      <a id="settingsLink" href="settings.html">設定</a>
      <a id="manageLink" href="manage_words.html">字庫管理</a>
    </div>
  </header>
  <main>
    <div class="flashcard-layout">
      <div id="stage" class="stage" role="img" aria-label="中文字卡"></div>
      <section class="practice-panel" id="practicePanel" aria-live="polite" hidden>
        <div class="practice-summary" id="practiceSummary"></div>
        <div class="answer-controls">
          <button class="correct-button" id="correctButton" type="button">答對</button>
          <button class="incorrect-button" id="incorrectButton" type="button">答錯</button>
        </div>
      </section>
      <div class="controls">
        <button id="nextButton" type="button">換字</button>
      </div>
      <div class="hint" id="status">載入中...</div>
    </div>
  </main>

  <script>
    const DEFAULT_WORDS = [
      "郭",
      "柚",
      "讓",
      "推",
      "拉",
      "茶",
      "走",
      "招",
      "地",
      "朵",
      "笑",
      "臉"
    ];

    const stage = document.getElementById("stage");
    const status = document.getElementById("status");
    const unitSelect = document.getElementById("unitSelect");
    const fontSelect = document.getElementById("fontSelect");
    const speakButton = document.getElementById("speakButton");
    const nextButton = document.getElementById("nextButton");
    const practicePanel = document.getElementById("practicePanel");
    const practiceSummary = document.getElementById("practiceSummary");
    const correctButton = document.getElementById("correctButton");
    const incorrectButton = document.getElementById("incorrectButton");
    let index = 0;
    let wordList = [];
    let remaining = [];
    let currentText = "";
    const STORAGE_KEY = "wordflash_units_v1";
    const FONT_KEY = "wordflash_font_family";
    const ZHUYIN_ENABLED_KEY = "wordflash_zhuyin_enabled";
    const DISPLAY_PREFERENCES_KEY = "wordflash_display_preferences_v1";
    const PRACTICE_MODE_KEY = "wordflash_practice_mode_v1";
    const PRACTICE_SESSION_KEY = "wordflash_practice_session_v1";
    const PRACTICE_MODES = new Set(["none", "statistics", "challenge"]);
    const DEFAULT_DISPLAY_PREFERENCES = {
      showUnitControl: true,
      showFontControl: true,
      showSpeakButton: true,
      showManageLink: true,
      showHint: true
    };
    const DEFAULT_FONT = "'Noto Serif TC', 'PingFang TC', 'Heiti TC', serif";
    const AUTO_ZHUYIN_MAP = {
      "一": "ㄧ",
      "二": "ㄦˋ",
      "三": "ㄙㄢ",
      "人": "ㄖㄣˊ",
      "大": "ㄉㄚˋ",
      "小": "ㄒㄧㄠˇ",
      "上": "ㄕㄤˋ",
      "下": "ㄒㄧㄚˋ",
      "手": "ㄕㄡˇ",
      "口": "ㄎㄡˇ",
      "天": "ㄊㄧㄢ",
      "地": "ㄉㄧˋ",
      "中": "ㄓㄨㄥ",
      "文": "ㄨㄣˊ",
      "字": "ㄗˋ",
      "學": "ㄒㄩㄝˊ",
      "生": "ㄕㄥ",
      "老": "ㄌㄠˇ",
      "師": "ㄕ",
      "我": "ㄨㄛˇ",
      "你": "ㄋㄧˇ",
      "他": "ㄊㄚ",
      "她": "ㄊㄚ",
      "它": "ㄊㄚ",
      "們": "ㄇㄣ˙",
      "的": "ㄉㄜ˙",
      "是": "ㄕˋ",
      "在": "ㄗㄞˋ",
      "來": "ㄌㄞˊ",
      "去": "ㄑㄩˋ",
      "看": "ㄎㄢˋ",
      "說": "ㄕㄨㄛ",
      "讀": "ㄉㄨˊ",
      "寫": "ㄒㄧㄝˇ",
      "走": "ㄗㄡˇ",
      "笑": "ㄒㄧㄠˋ",
      "臉": "ㄌㄧㄢˇ",
      "茶": "ㄔㄚˊ",
      "推": "ㄊㄨㄟ",
      "拉": "ㄌㄚ",
      "招": "ㄓㄠ",
      "朵": "ㄉㄨㄛˇ",
      "讓": "ㄖㄤˋ",
      "郭": "ㄍㄨㄛ",
      "柚": "ㄧㄡˋ"
    };
    let fontFamily = localStorage.getItem(FONT_KEY) || DEFAULT_FONT;
    let zhuyinEnabled = localStorage.getItem(ZHUYIN_ENABLED_KEY) !== "false";
    let displayPreferences = { ...DEFAULT_DISPLAY_PREFERENCES };
    let practiceMode = "none";
    let practiceSession = null;

    const loadDisplayPreferences = () => {
      try {
        return {
          ...DEFAULT_DISPLAY_PREFERENCES,
          ...JSON.parse(localStorage.getItem(DISPLAY_PREFERENCES_KEY) || "{}")
        };
      } catch {
        return { ...DEFAULT_DISPLAY_PREFERENCES };
      }
    };

    const applyDisplayPreferences = () => {
      document.getElementById("unitControl").hidden = !displayPreferences.showUnitControl;
      document.getElementById("fontControl").hidden = !displayPreferences.showFontControl;
      speakButton.hidden = !displayPreferences.showSpeakButton;
      document.getElementById("manageLink").hidden = !displayPreferences.showManageLink;
      status.hidden = !displayPreferences.showHint;
    };

    const loadPracticeMode = () => {
      const savedMode = localStorage.getItem(PRACTICE_MODE_KEY);
      return PRACTICE_MODES.has(savedMode) ? savedMode : "none";
    };

    const createDefaultPracticeSession = () => ({
      statistics: { correct: 0, incorrect: 0 },
      challenge: { correct: 0 }
    });

    const loadPracticeSession = () => {
      try {
        const saved = JSON.parse(localStorage.getItem(PRACTICE_SESSION_KEY) || "{}");
        return {
          statistics: {
            ...createDefaultPracticeSession().statistics,
            ...saved.statistics
          },
          challenge: {
            ...createDefaultPracticeSession().challenge,
            ...saved.challenge
          }
        };
      } catch {
        return createDefaultPracticeSession();
      }
    };

    const savePracticeSession = () => {
      localStorage.setItem(PRACTICE_SESSION_KEY, JSON.stringify(practiceSession));
    };

    const shuffle = (arr) => {
      for (let i = arr.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
    };

    const getAutoZhuyin = (text) => {
      if (!/[\u3400-\u9fff]/.test(text) || /[A-Za-z]/.test(text)) {
        return "";
      }
      const syllables = [];
      for (const char of [...text]) {
        const zhuyin = AUTO_ZHUYIN_MAP[char];
        if (!zhuyin) {
          return "";
        }
        syllables.push(zhuyin);
      }
      return syllables.join(" ");
    };

    const parseEntry = (rawValue) => {
      const raw = String(rawValue ?? "").trim();
      if (!raw) {
        return { text: "", zhuyin: "" };
      }
      const parts = raw.split("|");
      const text = (parts.shift() || "").trim();
      const manualZhuyin = parts.join("|").trim();
      return {
        text,
        zhuyin: manualZhuyin || getAutoZhuyin(text)
      };
    };

    const CHINESE_CHARACTER = /[\u3400-\u9fff]/u;
    const getZhuyinByCharacter = (text, zhuyinText) => {
      const syllables = String(zhuyinText).trim().split(/\s+/).filter(Boolean);
      const chineseCount = [...text].filter((character) => CHINESE_CHARACTER.test(character)).length;
      if (!syllables.length || syllables.length !== chineseCount) return [];

      let syllableIndex = 0;
      return [...text].map((character) => (
        CHINESE_CHARACTER.test(character) ? syllables[syllableIndex++] : ""
      ));
    };

    const drawWord = (text, zhuyinText = "") => {
      const annotations = getZhuyinByCharacter(text, zhuyinText);
      const characterCount = Math.max([...text].length, 1);
      const annotationCount = annotations.filter(Boolean).length;
      const stageWidth = stage.clientWidth || 1000;
      const size = Math.max(64, Math.min(420, Math.floor((stageWidth * 0.78) / (characterCount + annotationCount * 1.1))));
      const word = document.createElement("span");
      word.className = "word-display";
      word.style.setProperty("--word-font", fontFamily);
      word.style.setProperty("--word-size", `${size}px`);

      [...text].forEach((character, index) => {
        const annotation = annotations[index] || "";
        if (!annotation) {
          word.append(document.createTextNode(character));
          return;
        }
        const cell = document.createElement("span");
        cell.className = "zhuyin-cell";
        cell.setAttribute("aria-label", `${character}，注音 ${annotation}`);
        const ruby = document.createElement("ruby");
        ruby.className = "semantic-ruby";
        ruby.setAttribute("aria-hidden", "true");
        ruby.append(document.createTextNode(character));
        const rt = document.createElement("rt");
        rt.textContent = annotation;
        ruby.append(rt);
        const characterVisual = document.createElement("span");
        characterVisual.className = "character-visual";
        characterVisual.setAttribute("aria-hidden", "true");
        characterVisual.textContent = character;
        const visual = document.createElement("span");
        visual.className = "zhuyin-visual";
        visual.setAttribute("aria-hidden", "true");
        visual.textContent = annotation;
        cell.append(ruby, characterVisual, visual);
        word.append(cell);
      });

      stage.replaceChildren(word);
      stage.setAttribute("aria-label", zhuyinText ? `${text}，注音 ${zhuyinText}` : text);
    };

    const drawCurrentWord = () => {
      const entry = parseEntry(currentText);
      drawWord(entry.text, zhuyinEnabled ? entry.zhuyin : "");
    };

    const getSpeechConfig = (text) => {
      const normalized = text.trim();
      const hasCjk = /[\u3400-\u9fff]/.test(normalized);
      const hasLatin = /[A-Za-z]/.test(normalized);

      if (hasLatin && !hasCjk) {
        return {
          lang: "en-US",
          rate: 0.9
        };
      }

      return {
        lang: "zh-TW",
        rate: 0.85
      };
    };

    const speakCurrentWord = () => {
      if (!currentText) return;
      const entry = parseEntry(currentText);
      if (!entry.text) return;
      if (!("speechSynthesis" in window)) {
        status.textContent = "這個瀏覽器不支援語音朗讀。";
        return;
      }
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(entry.text);
      const speechConfig = getSpeechConfig(entry.text);
      utterance.lang = speechConfig.lang;
      utterance.rate = speechConfig.rate;
      utterance.onend = () => {
        status.textContent = "點畫布或按「播放讀音」朗讀，按下方「換字」切換下一個字";
      };
      utterance.onerror = () => {
        status.textContent = "播放讀音失敗，請再試一次。";
      };
      status.textContent = `正在播放：${entry.text}`;
      window.speechSynthesis.speak(utterance);
    };

    const refillRemaining = () => {
      remaining = [...wordList];
      shuffle(remaining);
    };

    const showNext = () => {
      if (!wordList.length) return;
      if (!remaining.length) {
        refillRemaining();
      }
      currentText = remaining.pop();
      drawCurrentWord();
      index += 1;
    };

    const createPracticeStat = (label, value) => {
      const item = document.createElement("div");
      item.className = "practice-stat";
      const labelElement = document.createElement("span");
      labelElement.textContent = label;
      const valueElement = document.createElement("strong");
      valueElement.textContent = value;
      item.append(labelElement, valueElement);
      return item;
    };

    const renderPracticePanel = () => {
      const isPracticeActive = practiceMode !== "none";
      practicePanel.hidden = !isPracticeActive;
      nextButton.textContent = isPracticeActive ? "跳過" : "換字";
      if (!isPracticeActive) return;

      if (practiceMode === "statistics") {
        const { correct, incorrect } = practiceSession.statistics;
        const total = correct + incorrect;
        const accuracy = total ? `${Math.round((correct / total) * 100)}%` : "—";
        practiceSummary.replaceChildren(
          createPracticeStat("答對", String(correct)),
          createPracticeStat("答錯", String(incorrect)),
          createPracticeStat("正確率", accuracy)
        );
        return;
      }

      practiceSummary.replaceChildren(
        createPracticeStat("目前連續答對", String(practiceSession.challenge.correct))
      );
    };

    const recordAnswer = (isCorrect) => {
      if (practiceMode === "none") return;
      if (practiceMode === "statistics") {
        const key = isCorrect ? "correct" : "incorrect";
        practiceSession.statistics[key] += 1;
      } else if (isCorrect) {
        practiceSession.challenge.correct += 1;
      } else {
        practiceSession.challenge.correct = 0;
      }
      savePracticeSession();
      renderPracticePanel();
      showNext();
      status.textContent = isCorrect ? "已記錄答對，已換下一題。" : "已記錄答錯，已換下一題。";
    };

    stage.addEventListener("pointerdown", (event) => {
      event.preventDefault();
      speakCurrentWord();
    });

    const loadUnits = () => {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch {
        return null;
      }
      return null;
    };

    const saveUnits = (data) => {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    };

    const startWithWords = (words) => {
      wordList = [...words];
      index = 0;
      refillRemaining();
      showNext();
      status.textContent = "點畫布或按「播放讀音」朗讀，按下方「換字」切換下一個字";
    };

    const refreshUnitSelect = (units, current) => {
      unitSelect.innerHTML = "";
      Object.keys(units).forEach((name) => {
        const option = document.createElement("option");
        option.value = name;
        option.textContent = name;
        unitSelect.appendChild(option);
      });
      unitSelect.value = current;
    };

    const fontOptions = [
      { label: "微軟正黑體（Microsoft JhengHei）", value: "'Microsoft JhengHei', 'PingFang TC', sans-serif" },
      { label: "新細明體（PMingLiU）", value: "'PMingLiU', 'MingLiU', serif" },
      { label: "標楷體", value: "'標楷體-繁', 'BiauKaiTC-Regular', 'BiauKai', 'DFKai-SB', 'KaiU', serif" },
      { label: "仿宋（FangSong）", value: "'FangSong', 'STFangsong', serif" },
      { label: "黑體（Heiti TC）", value: "'Heiti TC', 'PingFang TC', sans-serif" },
      { label: "Times New Roman", value: "'Times New Roman', Times, serif" },
      { label: "Georgia", value: "Georgia, serif" },
      { label: "Arial", value: "Arial, Helvetica, sans-serif" },
      { label: "Helvetica", value: "Helvetica, Arial, sans-serif" },
      { label: "Verdana", value: "Verdana, Geneva, sans-serif" }
    ];

    const initFonts = () => {
      fontSelect.innerHTML = "";
      fontOptions.forEach((font) => {
        const option = document.createElement("option");
        option.value = font.value;
        option.textContent = font.label;
        fontSelect.appendChild(option);
      });
      fontSelect.value = fontFamily;
    };

    const initUnits = () => {
      let data = loadUnits();
      if (!data || !data.units || !Object.keys(data.units).length) {
        data = {
          current: "第一字庫",
          units: {
            "第一字庫": DEFAULT_WORDS
          }
        };
        saveUnits(data);
      }
      refreshUnitSelect(data.units, data.current);
      startWithWords(data.units[data.current]);
      return data;
    };

    let state = initUnits();
    initFonts();
    displayPreferences = loadDisplayPreferences();
    practiceMode = loadPracticeMode();
    practiceSession = loadPracticeSession();
    applyDisplayPreferences();
    renderPracticePanel();
    status.textContent = "點畫布或按「播放讀音」朗讀，按下方「換字」切換下一個字";

    unitSelect.addEventListener("change", () => {
      const name = unitSelect.value;
      state.current = name;
      saveUnits(state);
      startWithWords(state.units[name]);
    });

    fontSelect.addEventListener("change", () => {
      fontFamily = fontSelect.value;
      localStorage.setItem(FONT_KEY, fontFamily);
      if (currentText) {
        drawCurrentWord();
      }
    });

    speakButton.addEventListener("click", speakCurrentWord);
    nextButton.addEventListener("click", showNext);
    correctButton.addEventListener("click", () => recordAnswer(true));
    incorrectButton.addEventListener("click", () => recordAnswer(false));

    window.addEventListener("storage", (event) => {
      if (event.key === FONT_KEY) {
        fontFamily = localStorage.getItem(FONT_KEY) || DEFAULT_FONT;
      } else if (event.key === ZHUYIN_ENABLED_KEY) {
        zhuyinEnabled = localStorage.getItem(ZHUYIN_ENABLED_KEY) !== "false";
      } else if (event.key === DISPLAY_PREFERENCES_KEY) {
        displayPreferences = loadDisplayPreferences();
        applyDisplayPreferences();
      } else if (event.key === PRACTICE_MODE_KEY) {
        practiceMode = loadPracticeMode();
        renderPracticePanel();
      } else if (event.key === PRACTICE_SESSION_KEY) {
        practiceSession = loadPracticeSession();
        renderPracticePanel();
      } else {
        return;
      }
      if (currentText) {
        drawCurrentWord();
      }
    });
  </script>
</body>
</html>
