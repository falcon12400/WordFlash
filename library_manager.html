<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WordFlash - 字庫管理</title>
  <style>
    :root { color-scheme:light; --ink:#2b2b2b; --paper:#fff9ec; --line:#39342d; --soft:#eee7d6; --selected:#dfead9; --tag:#e8f0f6; }
    * { box-sizing:border-box; } body { margin:0; padding:22px; background:var(--paper); color:var(--ink); font-family:"Noto Serif TC","PingFang TC",serif; }
    button, input, select { font:inherit; color:inherit; } button, input, select { min-height:42px; border:2px solid var(--line); border-radius:8px; background:#fffdf7; padding:7px 10px; }
    button { cursor:pointer; } button.secondary { background:var(--soft); } button.danger { border-color:#8a4137; color:#7a3028; } [hidden] { display:none !important; }
    h1 { font-size:26px; margin:0 0 6px; } h2 { font-size:20px; margin:0; } p { line-height:1.6; } .notice { color:#5e574e; margin:4px 0 18px; }
    .toolbar { display:flex; flex-wrap:wrap; gap:8px; margin:18px 0; } .layout { display:grid; grid-template-columns:minmax(250px, .9fr) minmax(0, 1.5fr); gap:16px; align-items:start; }
    .card { border:2px solid var(--line); border-radius:12px; background:#fffdf7; padding:14px; min-width:0; box-shadow:0 8px 20px rgba(51,43,32,.08); }
    .tree-head { display:flex; justify-content:space-between; gap:10px; align-items:center; margin-bottom:8px; } .tree-note { color:#625b51; font-size:14px; margin:0 0 10px; }
    .tree details { margin:2px 0; } .tree details > div { margin-left:18px; padding-left:10px; border-left:1px solid #d4c9b4; }
    summary { cursor:pointer; min-height:38px; display:flex; align-items:center; } .tree-row { display:flex; align-items:center; gap:7px; width:100%; min-height:40px; padding:4px 5px; border-radius:7px; }
    .tree-row:hover { background:#f1ecdf; } .tree-row[aria-current="true"] { background:var(--selected); outline:2px solid #809b7d; } .tree-item { border:0; padding:4px 5px; min-height:32px; background:transparent; text-align:left; flex:1; border-radius:5px; }
    .kind { flex:0 0 auto; border-radius:999px; padding:2px 7px; font-size:12px; line-height:1.35; border:1px solid #7890a0; background:var(--tag); } .kind.combo { background:#f4e7c6; border-color:#a47c31; } .kind.folder { background:#e4ecdf; border-color:#78916e; }
    .empty { border:1px dashed #b8ad99; border-radius:7px; padding:12px; color:#655e55; }
    .selection-title { display:flex; align-items:center; gap:8px; flex-wrap:wrap; } .selection-title strong { font-size:22px; } .selection-actions { display:flex; flex-wrap:wrap; gap:8px; margin:16px 0; }
    .detail-copy { color:#5e574e; margin:8px 0; } .frame-wrap { border-top:1px solid #d6cab6; margin-top:14px; padding-top:14px; } .detail-frame { border:0; width:100%; min-height:700px; background:transparent; }
    .inline-form { display:grid; gap:9px; margin-top:14px; } .inline-form label { display:grid; gap:5px; } .choice-tree { border:1px solid #c9bea9; border-radius:8px; padding:10px; max-height:390px; overflow:auto; } .choice-tree label { display:flex; gap:8px; align-items:center; min-height:34px; } .choice-tree input { min-height:auto; width:20px; height:20px; }
    .choice-branch { margin-left:16px; padding-left:9px; border-left:1px solid #d6cab6; } .status { min-height:1.6em; margin:12px 0 0; color:#514a42; }
    .move-form { display:flex; flex-wrap:wrap; gap:8px; align-items:end; margin-top:12px; } .move-form label { display:grid; gap:5px; flex:1; min-width:180px; }
    @media (max-width:760px) { body { padding:16px; } .layout { grid-template-columns:1fr; } .detail-frame { min-height:760px; } }
  </style>
</head>
<body>
  <p id="standalone"><a href="settings.html#manage">返回設定</a></p>
  <h1>字庫管理</h1>
  <p class="notice">先選擇字庫，再編輯內容或查看正確率。複合字庫只記錄要一起練習的字庫，不會複製字詞。</p>
  <div class="toolbar"><button id="addUnit" type="button">＋ 新增字庫</button><button id="addPreset" type="button">＋ 新增複合字庫</button><button id="addFolder" class="secondary" type="button">＋ 新增資料夾</button></div>
  <div class="layout">
    <section class="card tree" aria-labelledby="treeTitle"><div class="tree-head"><h2 id="treeTitle">字庫分類</h2></div><p class="tree-note">點選項目後，在右側開啟可用操作。</p><div id="libraryTree"></div></section>
    <section class="card" id="inspector" aria-live="polite"></section>
  </div>
  <p id="status" class="status" role="status"></p>
  <script type="module">
    import * as study from "./study-data.js?v=4";
    import { loadCloudUnits, saveCloudUnits, subscribeToUser } from "./firebase-wordflash.js?v=3";
    const $=id=>document.getElementById(id); const STORAGE_KEY="wordflash_units_v1";
    if(new URLSearchParams(location.search).has("embedded")) $("standalone").hidden=true;
    let data=study.organizer(), selected=null, mode="", newPresetFolder="", creationParent="", currentUser=null, cloudUnits=null;
    const unitsState=()=>{ try { return JSON.parse(localStorage.getItem(STORAGE_KEY))||{current:"",units:{}}; } catch { return {current:"",units:{}}; } };
    // The manager may open before another page has copied the cloud library to
    // localStorage. Keep the loaded cloud list for the tree, including empty
    // prepared libraries, while edits still use the normal local state.
    const names=()=>study.sortUnitNames(Object.keys((cloudUnits?.units||unitsState().units)||{}));
    const save=()=>{
      cloudUnits=unitsState();
      study.saveOrganizer(data);
      if (currentUser) {
        saveCloudUnits(currentUser,unitsState(),data,study.cloudData()).catch(error=>{
          console.error("WordFlash organizer cloud sync failed",error);
          $("status").textContent="分類已儲存在這台裝置，但雲端同步失敗；請稍後再試。";
        });
      }
    };
    const id=()=>globalThis.crypto?.randomUUID?.()||`${Date.now()}-${Math.random()}`;
    const children=parent=>data.folders.filter(f=>(f.parent||"")===parent);
    const members=parent=>names().filter(name=>{ const assignment=data.assignments[name]; return (data.folders.some(f=>f.id===assignment)?assignment:"")===parent; });
    const presets=parent=>data.presets.filter(p=>(p.folder||"")===parent);
    const folderById=key=>data.folders.find(f=>f.id===key);
    const keyOf=item=>item?`${item.kind}:${item.id}`:"";
    const decode=key=>{ const [kind,...rest]=String(key||"").split(":"); return {kind,id:rest.join(":")}; };
    const selectedItem=()=>{ const d=decode(selected); if(d.kind==="folder") return {kind:d.kind,...folderById(d.id)}; if(d.kind==="unit"&&names().includes(d.id)) return {kind:d.kind,id:d.id,name:d.id}; if(d.kind==="preset") return {kind:d.kind,...data.presets.find(p=>p.id===d.id)}; return null; };
    const parentOf=item=>item?.kind==="folder" ? (item.parent||"") : item?.kind==="unit" ? (data.assignments[item.name]||"") : (item?.folder||"");
    function treeButton(kind,item,label) { const row=document.createElement("div"), tag=document.createElement("span"), button=document.createElement("button"); row.className="tree-row"; row.setAttribute("aria-current",String(selected===keyOf({kind,id:item.id||item.name}))); tag.className=`kind ${kind==="preset"?"combo":kind==="folder"?"folder":""}`; tag.textContent=kind==="folder"?"資料夾":kind==="preset"?"複合":"字庫"; button.className="tree-item"; button.type="button"; button.textContent=label; button.onclick=()=>{ selected=keyOf({kind,id:item.id||item.name}); mode=""; render(); }; row.append(tag,button); return row; }
    function drawFolders(parent,container) { children(parent).forEach(folder=>{ const details=document.createElement("details"); details.open=true; const summary=document.createElement("summary"); summary.append(treeButton("folder",folder,`📁 ${folder.name}`)); details.append(summary); const branch=document.createElement("div"); draw(folder.id,branch); details.append(branch); container.append(details); }); }
    function draw(parent,container) { drawFolders(parent,container); members(parent).forEach(name=>container.append(treeButton("unit",{id:name,name},`📖 ${name}`))); presets(parent).forEach(p=>container.append(treeButton("preset",p,`🔗 ${p.name}`))); }
    function renderTree() { const tree=$("libraryTree"); tree.replaceChildren(); const root=document.createElement("details"); root.open=true; const summary=document.createElement("summary"); const rootRow=document.createElement("div"); rootRow.className="tree-row"; const rootTag=document.createElement("span"); rootTag.className="kind folder"; rootTag.textContent="資料夾"; const rootButton=document.createElement("button"); rootButton.className="tree-item"; rootButton.type="button"; rootButton.textContent="📁 未分類"; rootButton.onclick=()=>{selected="root:";mode="";render();}; rootRow.setAttribute("aria-current",String(selected==="root:")); rootRow.append(rootTag,rootButton); summary.append(rootRow); root.append(summary); const branch=document.createElement("div"); members("").forEach(name=>branch.append(treeButton("unit",{id:name,name},`📖 ${name}`))); presets("").forEach(p=>branch.append(treeButton("preset",p,`🔗 ${p.name}`))); root.append(branch); tree.append(root); drawFolders("",tree); if(!names().length) tree.append(Object.assign(document.createElement("p"),{className:"empty",textContent:"尚未建立字庫。請按「新增字庫」。"})); }
    function action(text,handler,style="") { const b=document.createElement("button"); b.type="button"; b.textContent=text; if(style)b.className=style; b.onclick=handler; return b; }
    function folderOptions(select,current,exclude=[]) { select.replaceChildren(new Option("未分類", "")); const add=(parent,prefix)=>children(parent).forEach(f=>{ if(exclude.includes(f.id))return; select.add(new Option(prefix+f.name,f.id)); add(f.id,prefix+"　"); }); add("",""); select.value=current||""; }
    function moveControl(item) { const wrap=document.createElement("div"), label=document.createElement("label"), select=document.createElement("select"), apply=action("移動",()=>{ const target=select.value; if(item.kind==="folder") item.parent=target; else if(item.kind==="unit") data.assignments[item.name]=target; else item.folder=target; save(); $("status").textContent="已移動。"; render(); }); wrap.className="move-form"; label.textContent="移動到分類"; folderOptions(select,parentOf(item),item.kind==="folder"?[item.id,...descendants(item.id)]:[]); label.append(select); wrap.append(label,apply); return wrap; }
    const descendants=parent=>children(parent).flatMap(f=>[f.id,...descendants(f.id)]);
    function editorFrame(item,view) { const wrap=document.createElement("div"), frame=document.createElement("iframe"); wrap.className="frame-wrap"; frame.className="detail-frame"; frame.title=view==="words"?`${item.name} 的單字正確率`:`編輯 ${item.name}`; frame.src=`manage_words.html?embedded=1&view=${view}&unit=${encodeURIComponent(item.name)}`; frame.addEventListener("load",()=>{ try { const resize=()=>frame.style.height=`${Math.max(650,Math.ceil(frame.contentDocument.documentElement.scrollHeight))}px`; new ResizeObserver(resize).observe(frame.contentDocument.body); resize(); } catch{} }); wrap.append(frame); return wrap; }
    function renderUnit(item,box) { const title=document.createElement("div"); title.className="selection-title"; title.append(Object.assign(document.createElement("span"),{className:"kind",textContent:"字庫"}),Object.assign(document.createElement("strong"),{textContent:item.name})); const count=(unitsState().units[item.name]||[]).length; const copy=document.createElement("p"); copy.className="detail-copy"; copy.textContent=`共 ${count} 個字詞。`; const actions=document.createElement("div"); actions.className="selection-actions"; actions.append(action("編輯字庫",()=>{mode="editor";render();}),action("查看單字正確率",()=>{mode="words";render();}),action("移動到…",()=>{mode="move";render();},"secondary"),action("刪除字庫",()=>deleteUnit(item),"danger")); box.append(title,copy,actions); if(mode==="move") box.append(moveControl(item)); if(mode==="editor"||mode==="words") box.append(editorFrame(item,mode)); }
    function deleteUnit(item) { if(names().length<=1){$("status").textContent="至少保留一個字庫。";return;} if(!confirm(`確定刪除字庫「${item.name}」？字庫內容會被刪除。`))return; const state=unitsState(); delete state.units[item.name]; state.current=Object.keys(state.units)[0]||""; localStorage.setItem(STORAGE_KEY,JSON.stringify(state)); delete data.assignments[item.name]; data.presets=data.presets.map(p=>({...p,units:p.units.filter(n=>n!==item.name)})); save(); selected=null; mode=""; $("status").textContent="已刪除字庫；引用它的複合字庫已自動移除該成員。"; render(); }
    function presetEditor(item,box) { const form=document.createElement("div"); form.className="inline-form"; const nameLabel=document.createElement("label"), nameInput=document.createElement("input"); nameLabel.textContent="複合字庫名稱"; nameInput.value=item?.name||""; nameInput.maxLength=80; nameLabel.append(nameInput); const help=document.createElement("p"); help.className="detail-copy"; help.textContent="勾選要一起練習的字庫；至少選擇一個。"; const selectedUnits=new Set(item?.units?.filter(n=>names().includes(n))||[]); const choices=document.createElement("div"); choices.className="choice-tree"; function choicesDraw(parent,container){ children(parent).forEach(folder=>{ const details=document.createElement("details"); details.open=true; const summary=document.createElement("summary"); summary.textContent=`📁 ${folder.name}`; details.append(summary); const branch=document.createElement("div"); branch.className="choice-branch"; choicesDraw(folder.id,branch); details.append(branch); container.append(details); }); members(parent).forEach(unit=>{ const label=document.createElement("label"), input=document.createElement("input"), text=document.createElement("span"); input.type="checkbox"; input.checked=selectedUnits.has(unit); input.onchange=()=>input.checked?selectedUnits.add(unit):selectedUnits.delete(unit); text.textContent=unit; label.append(input,text); container.append(label); }); } choicesDraw("",choices); const saveButton=action("儲存複合字庫",()=>{ const name=nameInput.value.trim(), units=[...selectedUnits]; if(!name||!units.length){$("status").textContent="請輸入名稱並至少選擇一個字庫。";return;} if(data.presets.some(p=>p.name===name&&p.id!==item?.id)){ $("status").textContent="已有同名複合字庫。";return;} const preset={id:item?.id||id(),name,units,folder:item?.folder||newPresetFolder||""}; if(item)data.presets=data.presets.map(p=>p.id===item.id?preset:p); else data.presets.push(preset); save(); newPresetFolder=""; selected=`preset:${preset.id}`;mode="";$("status").textContent="已儲存複合字庫。";render();}); form.append(nameLabel,help,choices,saveButton); box.append(form); }
    function renderPreset(item,box) { const title=document.createElement("div"); title.className="selection-title"; title.append(Object.assign(document.createElement("span"),{className:"kind combo",textContent:"複合"}),Object.assign(document.createElement("strong"),{textContent:item.name})); const valid=item.units.filter(n=>names().includes(n)); const copy=document.createElement("p"); copy.className="detail-copy"; copy.textContent=`包含：${valid.join("、")||"沒有有效字庫"}${valid.length!==item.units.length?"（部分字庫已刪除）":""}`; const actions=document.createElement("div");actions.className="selection-actions";actions.append(action("編輯組成",()=>{mode="preset";render();}),action("移動到…",()=>{mode="move";render();},"secondary"),action("刪除複合字庫",()=>{if(confirm(`刪除複合字庫「${item.name}」？原始字庫不會被刪除。`)){data.presets=data.presets.filter(p=>p.id!==item.id);save();selected=null;mode="";render();}},"danger")); box.append(title,copy,actions); if(mode==="move")box.append(moveControl(item)); if(mode==="preset")presetEditor(item,box); }
    function renderFolder(item,box) { const name=item?.name||"未分類"; const title=document.createElement("div");title.className="selection-title";title.append(Object.assign(document.createElement("span"),{className:"kind folder",textContent:"資料夾"}),Object.assign(document.createElement("strong"),{textContent:`📁 ${name}`})); const copy=document.createElement("p");copy.className="detail-copy";copy.textContent="資料夾只負責整理，不會改變字詞內容。"; const actions=document.createElement("div");actions.className="selection-actions";actions.append(action("新增子資料夾",()=>addFolder(item?.id||"")),action("重新命名",()=>{if(!item)return;const name=prompt("資料夾名稱",item.name)?.trim();if(name){item.name=name;save();render();}}),action("移動到…",()=>{if(item){mode="move";render();}},"secondary")); if(item)actions.append(action("刪除空資料夾",()=>{if(children(item.id).length||members(item.id).length||presets(item.id).length){$("status").textContent="請先移走資料夾內的項目。";return;}if(confirm(`刪除空資料夾「${item.name}」？`)){data.folders=data.folders.filter(f=>f.id!==item.id);save();selected=null;render();}},"danger"));box.append(title,copy,actions);if(mode==="move"&&item)box.append(moveControl(item)); }
    function createEditor(kind,box) { const folder=folderById(creationParent); const label=kind==="folder"?"資料夾名稱":"字庫名稱"; box.append(Object.assign(document.createElement("h2"),{textContent:kind==="folder"?"新增資料夾":"新增字庫"}),Object.assign(document.createElement("p"),{className:"detail-copy",textContent:`會新增在「${folder?.name||"未分類"}」下。`})); const form=document.createElement("div");form.className="inline-form";const field=document.createElement("label"),input=document.createElement("input");field.textContent=label;input.id="newItemName";input.maxLength=80;input.autocomplete="off";field.append(input);const actions=document.createElement("div");actions.className="selection-actions";actions.append(action(kind==="folder"?"建立資料夾":"建立字庫",()=>{const name=input.value.trim();if(!name){$("status").textContent=`請輸入${label}。`;return;}if(kind==="folder"){const folder={id:id(),name,parent:creationParent};data.folders.push(folder);save();selected=`folder:${folder.id}`;mode="";$("status").textContent="已新增資料夾。";}else{const state=unitsState();if(state.units[name]){$("status").textContent="此字庫已存在。";return;}state.units[name]=[];state.current=name;localStorage.setItem(STORAGE_KEY,JSON.stringify(state));data.assignments[name]=creationParent;save();selected=`unit:${name}`;mode="editor";$("status").textContent="已新增字庫，請輸入內容並儲存。";}render();}),action("取消",()=>{mode="";render();},"secondary"));form.append(field,actions);box.append(form);input.focus(); }
    function renderInspector(){ const box=$("inspector");box.replaceChildren();if(mode==="new-folder"){createEditor("folder",box);return;}if(mode==="new-unit"){createEditor("unit",box);return;}const item=selectedItem(); if(selected==="root:"){renderFolder(null,box);return;} if(!item){box.append(Object.assign(document.createElement("h2"),{textContent:"選擇一個字庫"}),Object.assign(document.createElement("p"),{className:"detail-copy",textContent:"可從左側選擇字庫、複合字庫或資料夾。"}));return;}if(item.kind==="unit")renderUnit(item,box);else if(item.kind==="preset")renderPreset(item,box);else renderFolder(item,box); }
    function render(){renderTree();renderInspector();} function startCreate(kind,parent=""){creationParent=parent;mode=`new-${kind}`;render();} function addFolder(parent=""){startCreate("folder",parent);}
    $("addFolder").onclick=()=>addFolder(selectedItem()?.kind==="folder"?selectedItem().id:parentOf(selectedItem()));
    $("addUnit").onclick=()=>startCreate("unit",selectedItem()?.kind==="folder"?selectedItem().id:parentOf(selectedItem()));
    $("addPreset").onclick=()=>{newPresetFolder=selectedItem()?.kind==="folder"?selectedItem().id:parentOf(selectedItem());selected=null;mode="newPreset";const box=$("inspector");box.replaceChildren();box.append(Object.assign(document.createElement("h2"),{textContent:"新增複合字庫"}));presetEditor(null,box);};
    window.wordflashHasUnsavedChanges=()=>{ const frame=$("inspector").querySelector("iframe");return Boolean(frame?.contentWindow?.wordflashHasUnsavedChanges?.()); };
    subscribeToUser(async user=>{
      currentUser=user;
      if (!user) return;
      try {
        const cloudLibrary=await loadCloudUnits(user);
        if (cloudLibrary) {
          cloudUnits=cloudLibrary;
          // Use the same authoritative library that the tree is showing. This
          // prevents a later folder operation from writing an older local copy
          // over the signed-in user's cloud library.
          localStorage.setItem(STORAGE_KEY,JSON.stringify({current:cloudLibrary.current,units:cloudLibrary.units}));
        }
        if (cloudLibrary?.organizer) {
          data=cloudLibrary.organizer;
          study.saveOrganizer(data);
        }
        if (cloudLibrary?.study) study.applyCloudData(cloudLibrary.study);
        render();
      } catch (error) {
        console.error("WordFlash organizer cloud load failed",error);
      }
    });
    window.addEventListener("storage",event=>{if([STORAGE_KEY,study.ORGANIZER_KEY,study.WORD_STATS_KEY,study.DISABLED_KEY].includes(event.key))render();}); render();
  </script>
</body>
</html>
