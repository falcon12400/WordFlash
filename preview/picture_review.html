<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>注音複習 - WordFlash</title>
  <style>
    :root { color-scheme: light; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      min-height: 100dvh;
      background: radial-gradient(circle at top, #f7f4e8 0%, #efe6d5 45%, #e8dcc8 100%);
      font-family: "Noto Serif TC", "PingFang TC", "Heiti TC", serif;
      color: #2b2b2b;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 20px;
      border-bottom: 2px solid #2b2b2b;
      background: rgba(255, 249, 236, 0.92);
    }
    header .title { font-size: 20px; font-weight: 700; letter-spacing: 0.08em; }
    header .menu { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 14px; }
    header select, header a {
      min-height: 40px;
      box-sizing: border-box;
      border: 2px solid #2b2b2b;
      border-radius: 8px;
      padding: 6px 10px;
      background: #fff9ec;
      font: inherit;
      font-size: 15px;
      color: inherit;
      text-decoration: none;
      display: inline-grid;
      place-items: center;
    }
    main { width: min(100% - 20px, 1100px); margin: 14px auto 32px; display: grid; gap: 12px; }
    .hint { margin: 0; text-align: center; font-size: 15px; line-height: 1.5; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
    .review-card {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-rows: auto auto auto;
      gap: 6px 10px;
      padding: 10px;
      border: 3px solid #2b2b2b;
      border-radius: 14px;
      background: #fffdf6;
      box-shadow: 0 6px 0 #2b2b2b;
    }
    .review-card.is-hard { background: #fbe9e4; border-color: #9a3b2c; box-shadow: 0 6px 0 #9a3b2c; }
    .review-card img { grid-column: 1; grid-row: 1 / 3; width: 100%; aspect-ratio: 1; object-fit: contain; background: #fff9ec; border-radius: 8px; }
    .review-card .zhuyin { grid-column: 2; grid-row: 1 / 3; align-self: center; padding: 0 4px; }
    .review-card .word { grid-column: 1 / -1; font-size: 26px; font-weight: 700; letter-spacing: 0.1em; text-align: center; }
    .review-card .stat { grid-column: 1 / -1; font-size: 14px; color: #5b554d; text-align: center; }
    .review-card.is-hard .stat { color: #8a2f22; font-weight: 700; }
    .rank {
      position: absolute;
      top: -10px;
      left: -10px;
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border: 2px solid #2b2b2b;
      border-radius: 50%;
      background: #f7c948;
      font-family: system-ui, sans-serif;
      font-weight: 800;
      font-size: 15px;
    }
    .vzy { display: inline-flex; align-items: flex-start; gap: 0.85em; font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif; font-size: 30px; font-weight: 600; line-height: 1; }
    .vzy-syllable { display: inline-flex; flex-direction: column; align-items: center; }
    .vzy-letter { position: relative; display: block; height: 1.08em; line-height: 1.08em; }
    .vzy-tone { position: absolute; left: 80%; top: -0.12em; font-size: 1em; }
    .vzy-light { display: block; height: 0.6em; line-height: 0.6em; }
    .empty { padding: 24px; text-align: center; border: 2px solid #2b2b2b; border-radius: 12px; background: rgba(255, 249, 236, 0.94); line-height: 1.6; }
    .empty a { color: inherit; }
    @media (max-width: 520px) {
      header { padding: 10px 12px; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 10px; }
      .review-card { grid-template-columns: 1fr; grid-template-rows: auto auto auto auto; padding: 8px; }
      .review-card img { grid-row: 1; }
      .review-card .zhuyin { grid-column: 1; grid-row: 2; justify-self: center; }
      .review-card .word { font-size: 22px; }
      .review-card .stat { font-size: 12px; }
      .vzy { font-size: 24px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="title">注音複習</div>
    <nav class="menu">
      <select id="setSelect" aria-label="題組"></select>
      <a href="picture_quiz.html">注音練習</a>
      <a href="picture_sets.html">題組管理</a>
    </nav>
  </header>
  <main>
    <p class="hint" id="hint">載入中...</p>
    <div class="grid" id="grid"></div>
  </main>

  <script type="module">
    import { ACTIVITY, listSets, listCards, loadImage, isCardEnabled } from "./picture-questions.js?v=5";
    import { questionStats } from "./question-progress.js?v=1";
    import { renderVerticalZhuyin } from "./bopomofo.js?v=1";

    const SET_KEY = "wordflash_picture_set_v1";
    const setSelect = document.getElementById("setSelect");
    const grid = document.getElementById("grid");
    const hint = document.getElementById("hint");

    // Highest error rate first; among equal rates, more wrong answers first;
    // questions never answered go last.
    const order = (a, b) => {
      if ((a.rate === null) !== (b.rate === null)) return a.rate === null ? 1 : -1;
      return (b.rate ?? 0) - (a.rate ?? 0) || b.stats.incorrect - a.stats.incorrect || a.card.order - b.card.order;
    };

    const show = async (setId) => {
      localStorage.setItem(SET_KEY, setId);
      setSelect.value = setId;
      const cards = (await listCards(setId)).filter(card => isCardEnabled(card.id));
      grid.replaceChildren();
      if (!cards.length) {
        hint.textContent = "";
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.innerHTML = '這個題組目前沒有開啟的題目。請到<a href="picture_sets.html">題組管理</a>勾選要出題的題目。';
        grid.append(empty);
        return;
      }
      const items = cards.map((card) => {
        const stats = questionStats({ activity: ACTIVITY, id: card.id });
        const total = stats.correct + stats.incorrect;
        return { card, stats, total, rate: total ? stats.incorrect / total : null };
      }).sort(order);
      hint.textContent = `共 ${items.length} 題（只列出開啟出題的題目），常答錯的排在前面。`;
      for (const [index, item] of items.entries()) {
        const box = document.createElement("article");
        const hard = item.rate !== null && item.rate >= 0.5 && item.stats.incorrect > 0;
        box.className = `review-card${hard ? " is-hard" : ""}`;
        const rank = document.createElement("span");
        rank.className = "rank";
        rank.textContent = String(index + 1);
        const img = document.createElement("img");
        img.alt = item.card.word || item.card.answer;
        img.src = await loadImage(item.card.id);
        const zhuyin = document.createElement("div");
        zhuyin.className = "zhuyin";
        zhuyin.setAttribute("aria-label", `注音 ${item.card.answer}`);
        zhuyin.append(renderVerticalZhuyin(item.card.answer));
        const word = document.createElement("div");
        word.className = "word";
        word.textContent = item.card.word || "";
        const stat = document.createElement("div");
        stat.className = "stat";
        stat.textContent = item.total
          ? `答錯 ${item.stats.incorrect} 次／共 ${item.total} 次（錯誤率 ${Math.round(item.rate * 100)}%）`
          : "還沒練習過";
        box.append(rank, img, zhuyin, word, stat);
        grid.append(box);
      }
    };

    const sets = await listSets();
    if (!sets.length) {
      hint.innerHTML = '還沒有題組，請先到<a href="picture_sets.html">題組管理</a>載入。';
      setSelect.hidden = true;
    } else {
      setSelect.replaceChildren(...sets.map((set) => {
        const option = document.createElement("option");
        option.value = set.id;
        option.textContent = set.name;
        return option;
      }));
      const saved = localStorage.getItem(SET_KEY);
      await show(sets.some(set => set.id === saved) ? saved : sets[0].id);
      setSelect.addEventListener("change", () => show(setSelect.value));
    }
  </script>
</body>
</html>
