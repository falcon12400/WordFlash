<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>練習紀錄 - WordFlash</title>
  <style>
    :root { color-scheme: light; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      min-height: 100dvh;
      background: radial-gradient(circle at top, #f7f4e8 0%, #efe6d5 45%, #e8dcc8 100%);
      font-family: "Noto Serif TC", "PingFang TC", "Heiti TC", serif;
      color: #2b2b2b;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 24px;
      border-bottom: 2px solid #2b2b2b;
      background: rgba(255, 249, 236, 0.92);
    }
    header .title { font-size: 20px; font-weight: 700; letter-spacing: 0.08em; }
    header nav { display: flex; gap: 8px; }
    header a, button {
      border: 2px solid #2b2b2b;
      border-radius: 8px;
      padding: 8px 12px;
      background: #fff9ec;
      font: inherit;
      font-size: 15px;
      color: inherit;
      text-decoration: none;
      cursor: pointer;
    }
    main { width: min(100% - 24px, 820px); margin: 16px auto 32px; display: grid; gap: 14px; }
    .status {
      padding: 12px 16px;
      border: 2px solid #2b2b2b;
      border-radius: 12px;
      background: #f8edcf;
      line-height: 1.6;
    }
    .status a { color: inherit; }
    .log {
      display: grid;
      gap: 6px;
      padding: 14px 16px;
      border: 2px solid #2b2b2b;
      border-radius: 12px;
      background: rgba(255, 249, 236, 0.96);
    }
    .log-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 12px; }
    .log-title { font-size: 17px; font-weight: 700; }
    .log-meta { font-size: 14px; color: #5b554d; }
    .badge { align-self: start; padding: 2px 8px; border-radius: 999px; font-size: 13px; border: 1px solid currentColor; white-space: nowrap; }
    .badge.is-uploaded { color: #2f6b2a; }
    .badge.is-pending { color: #8a5a00; }
    .badge.is-open { color: #2d5f8a; }
    .score { font-size: 16px; }
    .wrong { margin: 0; padding-left: 1.2em; font-size: 15px; line-height: 1.6; }
    .note { font-size: 13px; color: #6b655c; }
    .empty { text-align: center; padding: 24px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .actions button:disabled { opacity: 0.5; cursor: default; }
    .message { min-height: 1.2em; font-size: 15px; }
    .transfer { display: grid; gap: 6px; padding: 12px 16px; border: 2px dashed #2b2b2b; border-radius: 12px; background: rgba(255, 249, 236, 0.9); }
    .transfer p { margin: 0; font-size: 14px; line-height: 1.6; color: #5b554d; }
    .file-button { border: 2px solid #2b2b2b; border-radius: 8px; padding: 8px 12px; background: #fff9ec; font-size: 15px; cursor: pointer; }
    .file-button input { display: none; }
  </style>
</head>
<body>
  <header>
    <div class="title">練習紀錄</div>
    <nav>
      <a href="picture_quiz.html">注音練習</a>
      <a href="picture_sets.html">題組管理</a>
    </nav>
  </header>
  <main>
    <div class="status" id="status">載入中...</div>
    <div class="actions">
      <button id="uploadAll" type="button">把這台裝置的紀錄全部上傳</button>
      <button id="downloadAll" type="button">下載帳號裡的全部紀錄</button>
      <button id="exportCsv" type="button">匯出成表格檔（CSV）</button>
    </div>
    <div class="transfer">
      <strong>不用登入，把紀錄傳到別台裝置</strong>
      <p>在這台按「傳出紀錄」，用 AirDrop、LINE 或檔案傳到已登入的裝置；在那台按「匯入紀錄檔」，它就會幫忙上傳。</p>
      <div class="actions">
        <button id="shareLogs" type="button">傳出紀錄</button>
        <label class="file-button">匯入紀錄檔<input id="importLogs" type="file" accept=".json,application/json" /></label>
      </div>
    </div>
    <div class="message" id="message" role="status"></div>
    <div id="list"></div>
  </main>

  <script type="module">
    import { loadLogs, openLogSummary, closeStaleLog, logsToCsv, exportLogsFile, importLogsFile } from "./practice-log.js?v=4";
    import { importPictureLegacy, startCloudSync } from "./picture-logs.js?v=2";

    const status = document.getElementById("status");
    const list = document.getElementById("list");
    const MODE_LABELS = { statistics: "統計", challenge: "挑戰", totals: "累計" };

    const formatTime = (iso) => {
      const date = new Date(iso);
      if (Number.isNaN(date.getTime())) return "";
      return date.toLocaleString("zh-TW", { year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
    };

    const describeWrong = (item) => {
      const chosen = item.chosen?.length ? `，選了 ${item.chosen.join("、")}` : "";
      return `${item.word}（${item.answer}${chosen}）${item.times > 1 ? ` × ${item.times}` : ""}`;
    };

    const render = (logs, signedIn) => {
      list.replaceChildren();
      if (!logs.length) {
        const empty = document.createElement("div");
        empty.className = "log empty";
        empty.textContent = "還沒有練習紀錄。在「注音練習」用統計或挑戰模式答題後，這裡會出現每一輪的紀錄。";
        list.append(empty);
        return;
      }
      for (const log of logs) {
        const box = document.createElement("article");
        box.className = "log";
        const head = document.createElement("div");
        head.className = "log-head";
        const text = document.createElement("div");
        const title = document.createElement("div");
        title.className = "log-title";
        const timed = log.timedRunId ? "計時" : "";
        title.textContent = `${log.setName || "練習"}・${timed}${MODE_LABELS[log.mode] || ""}`;
        const meta = document.createElement("div");
        meta.className = "log-meta";
        meta.textContent = [formatTime(log.startedAt), log.device].filter(Boolean).join("・");
        text.append(title, meta);
        const badge = document.createElement("span");
        if (log.status === "open") { badge.className = "badge is-open"; badge.textContent = "進行中"; }
        else if (log.uploadedAt) { badge.className = "badge is-uploaded"; badge.textContent = "已上傳"; }
        else { badge.className = "badge is-pending"; badge.textContent = signedIn ? "上傳中" : "尚未上傳"; }
        head.append(text, badge);
        box.append(head);

        const score = document.createElement("div");
        score.className = "score";
        score.textContent = `共 ${log.total} 題，答對 ${log.correct}、答錯 ${log.incorrect}`
          + (log.accuracy === null || log.accuracy === undefined ? "" : `，正確率 ${Number(log.accuracy).toFixed(1)}%`)
          + (log.bestStreak ? `，最高連續答對 ${log.bestStreak} 題` : "");
        box.append(score);

        if (log.wrong?.length) {
          const label = document.createElement("div");
          label.className = "log-meta";
          label.textContent = log.source === "legacy-totals" ? "曾經答錯：" : "答錯的題目：";
          const wrong = document.createElement("ul");
          wrong.className = "wrong";
          log.wrong.forEach((item) => {
            const li = document.createElement("li");
            li.textContent = describeWrong(item);
            wrong.append(li);
          });
          box.append(label, wrong);
        }
        if (log.note) {
          const note = document.createElement("div");
          note.className = "note";
          note.textContent = log.note;
          box.append(note);
        }
        list.append(box);
      }
    };

    let cloudLogs = [];
    let signedIn = false;
    let shownLogs = [];
    const refresh = () => {
      const byId = new Map();
      cloudLogs.forEach(log => byId.set(log.id, { ...log, uploadedAt: log.uploadedAt || true }));
      loadLogs().forEach(log => byId.set(log.id, { ...byId.get(log.id), ...log, uploadedAt: log.uploadedAt || byId.get(log.id)?.uploadedAt || null }));
      const open = openLogSummary();
      if (open) byId.set(open.id, { ...open, status: "open" });
      const logs = [...byId.values()].sort((a, b) => String(b.startedAt).localeCompare(String(a.startedAt)));
      shownLogs = logs;
      document.getElementById("uploadAll").disabled = !signedIn;
      document.getElementById("downloadAll").disabled = !signedIn;
      document.getElementById("exportCsv").disabled = !logs.length;
      render(logs, signedIn);
    };

    let checkedSummary = 0;
    const showStatus = ({ signedIn: nowSignedIn, pending, error, cloudCount }) => {
      if (cloudCount) checkedSummary = cloudCount;
      signedIn = nowSignedIn;
      if (error && !nowSignedIn) status.textContent = "目前連不上雲端；紀錄先存在這台裝置，之後再上傳。";
      else if (!nowSignedIn) status.innerHTML = `這台裝置還沒登入 Google，紀錄先存在這台裝置${pending ? `（${pending} 筆待上傳）` : ""}。請到<a href="settings.html#cloud">設定頁</a>登入，回來後就會自動上傳。`;
      else if (error) status.textContent = `上傳失敗，稍後會再試（${pending} 筆待上傳）。`;
      else if (pending) status.textContent = `上傳中（${pending} 筆）…`;
      else status.textContent = `已核對：這台裝置和雲端的紀錄一致${checkedSummary ? `（雲端共 ${checkedSummary} 筆）` : ""}。每一輪各自分開保存，不會互相覆蓋。`;
      refresh();
    };

    closeStaleLog();
    await importPictureLegacy().catch(error => console.warn(error));
    refresh();
    const cloud = startCloudSync(async (state) => {
      showStatus(state);
      if (state.signedIn && !state.error) {
        try { cloudLogs = (await cloud.loadCloudLogs()) || []; refresh(); } catch (error) { console.warn(error); }
      }
    });
    cloud.sync();

    const message = document.getElementById("message");
    document.getElementById("uploadAll").addEventListener("click", async () => {
      message.textContent = "上傳中…";
      try { await cloud.uploadAll(); message.textContent = "這台裝置的紀錄都已上傳。"; }
      catch (error) { message.textContent = `上傳失敗：${error.message}`; }
      refresh();
    });
    document.getElementById("downloadAll").addEventListener("click", async () => {
      message.textContent = "下載中…";
      try {
        const added = await cloud.downloadAll();
        cloudLogs = (await cloud.loadCloudLogs()) || cloudLogs;
        message.textContent = added ? `已下載 ${added} 筆其他裝置的紀錄。` : "帳號裡的紀錄都已經在這台裝置上了。";
      } catch (error) { message.textContent = `下載失敗：${error.message}`; }
      refresh();
    });
    document.getElementById("shareLogs").addEventListener("click", async () => {
      const name = `WordFlash-練習紀錄-${new Date().toISOString().slice(0, 10)}.json`;
      const file = new File([exportLogsFile()], name, { type: "application/json" });
      // iPad / iPhone: open the share sheet (AirDrop, LINE…); otherwise download.
      if (navigator.canShare?.({ files: [file] })) {
        try { await navigator.share({ files: [file], title: "WordFlash 練習紀錄" }); message.textContent = "已傳出紀錄檔。"; return; }
        catch (error) { if (error?.name === "AbortError") return; }
      }
      const link = document.createElement("a");
      link.href = URL.createObjectURL(file);
      link.download = name;
      link.click();
      setTimeout(() => URL.revokeObjectURL(link.href), 1000);
      message.textContent = "已下載紀錄檔，請傳到已登入的裝置後按「匯入紀錄檔」。";
    });
    document.getElementById("importLogs").addEventListener("change", async (event) => {
      const file = event.target.files?.[0];
      event.target.value = "";
      if (!file) return;
      try {
        const result = importLogsFile(await file.text());
        message.textContent = result.added
          ? `已匯入 ${result.added} 筆${result.from ? `${result.from}的` : ""}紀錄${signedIn ? "，正在上傳。" : "；這台登入後就會上傳。"}`
          : "檔案裡的紀錄這台都已經有了。";
        if (signedIn) await cloud.sync();
      } catch (error) {
        message.textContent = `無法匯入：${error.message}`;
      }
      refresh();
    });
    document.getElementById("exportCsv").addEventListener("click", () => {
      const blob = new Blob([logsToCsv(shownLogs.filter(log => log.status !== "open"))], { type: "text/csv;charset=utf-8" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `WordFlash-練習紀錄-${new Date().toISOString().slice(0, 10)}.csv`;
      link.click();
      setTimeout(() => URL.revokeObjectURL(link.href), 1000);
    });
  </script>
</body>
</html>
